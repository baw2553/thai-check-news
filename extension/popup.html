<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Thai Check News</title>
  <style>
    body,button,textarea{font-family:"Segoe UI",Tahoma,sans-serif!important}
    *{box-sizing:border-box}body{margin:0;width:370px;background:#f4f4f2;color:#171717;font-family:"Leelawadee UI",Tahoma,sans-serif}.head{background:#111;color:#fff;padding:18px 18px 16px;border-top:6px solid #f36b21}.brand{font-weight:900;font-size:18px;letter-spacing:.03em}.brand i{font-style:normal;color:#f36b21;margin-right:8px}.head p{margin:8px 0 0;color:#bdbdbd;font-size:13px}.body{padding:16px}textarea{width:100%;min-height:112px;resize:vertical;border:1px solid #999;border-radius:0;padding:12px;font:inherit;font-size:14px;outline:none;background:#fff}textarea:focus{border-color:#f36b21;box-shadow:0 0 0 3px rgba(243,107,33,.16)}button{width:100%;border:0;border-radius:0;padding:12px 14px;font:inherit;font-weight:900;cursor:pointer}.primary{background:#f36b21;color:#111;margin-top:10px}.secondary{background:#fff;color:#222;border:1px solid #aaa;margin-top:8px}.hint{font-size:12px;color:#666;margin:12px 2px 0}.status{font-size:12px;color:#8d3e08;background:#ffede1;border-left:4px solid #f36b21;padding:9px 10px;margin-bottom:10px;display:none}.status.show{display:block}
  </style>
</head>
<body><div class="head"><div class="brand"><i>■</i>THAI CHECK NEWS</div><p>ตามหาเหตุการณ์เดียวกัน แม้แต่ละแหล่งจะพาดหัวต่างกัน</p></div><div class="body"><div id="status" class="status"></div><textarea id="text" placeholder="ข้อความข่าวที่เลือกจะปรากฏตรงนี้…"></textarea><button class="primary" id="check">เทียบข่าวหน้านี้</button><button class="secondary" id="capture">อ่านข้อความที่คลุมอยู่</button><p class="hint">คลิกขวาบนหน้าข่าว หรือคลุมข้อความแล้วคลิกขวา → “ตรวจข่าวนี้กับ Thai Check News” ระบบจะส่ง URL หน้าข่าวไปตรวจด้วย หากอ่านบทความไม่ได้จะแจ้งตรง ๆ</p></div><script src="popup.js"></script></body>
</html>
